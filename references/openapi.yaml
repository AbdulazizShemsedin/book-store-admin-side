            - "123456"
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]+$
          type: string
        phone:
          examples:
            - "+251900000000"
          type: string
        pin:
          examples:
            - "123456"
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]+$
          type: string
      required:
        - phone
        - code
        - pin
      type: object
